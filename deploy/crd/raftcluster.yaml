apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: raftclusters.infra.hugo.dev
spec:
  group: infra.hugo.dev
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              replicas:
                type: integer
                minimum: 1
                default: 3
              image:
                type: string
                default: "hugo/raft-node:latest"
              resources:
                type: object
                properties:
                  cpu:
                    type: string
                  memory:
                    type: string
              storage:
                type: object
                properties:
                  size:
                    type: string
              service:
                type: object
                properties:
                  type:
                    type: string
                    default: "ClusterIP"
                  port:
                    type: integer
                    default: 8080
          status:
            type: object
            properties:
              phase:
                type: string
              readyReplicas:
                type: integer
              leader:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: raftclusters
    singular: raftcluster
    kind: RaftCluster
    shortNames:
    - raft
    - rc



