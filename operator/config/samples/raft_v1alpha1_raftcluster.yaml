apiVersion: raft.conflux.io/v1alpha1
kind: RaftCluster
metadata:
  name: raft-sample
  namespace: default
spec:
  replicas: 3
  image: conflux-raft:latest
  storageSize: "1Gi"
  # storageClassName: "standard"  # Optional: specify storage class
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
