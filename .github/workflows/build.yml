name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build
      run: |
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -o bin/raft-node-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/raftnode

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: raft-node-${{ matrix.goos }}-${{ matrix.goarch }}
        path: bin/raft-node-${{ matrix.goos }}-${{ matrix.goarch }}

  build-docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: build-binary
    if: github.event_name != 'pull_request'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/raft-operator:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/raft-operator:${{ github.sha }}
