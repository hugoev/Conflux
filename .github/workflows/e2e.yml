name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'test/e2e/**'
      - 'operator/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'Dockerfile'

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1.8.0
      with:
        cluster_name: raft-e2e

    - name: Build Docker Image
      run: |
        docker build -t raft-operator:e2e .
        kind load docker-image raft-operator:e2e --name raft-e2e

    - name: Install CRDs and Deploy Operator
      run: |
        make install
        make deploy IMG=raft-operator:e2e

    - name: Run E2E Tests
      run: go test -v -timeout 20m ./test/e2e/...

    - name: Collect Logs on Failure
      if: failure()
      run: |
        kubectl get pods -A
        kubectl logs -n raft-operator-system -l control-plane=controller-manager --tail=-1
        kubectl describe pods -l app=raft -A
