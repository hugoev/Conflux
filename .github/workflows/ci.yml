  # E2E tests - only on main branch or PRs with e2e label
  # Note: E2E tests build images locally, so they don't depend on Docker Hub secrets
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-tests, operator-tests]
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Set up Kind
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: conflux-e2e
          node_image: kindest/node:v1.28.0

      - name: Build and load images
        run: |
          docker build -t conflux:e2e .
          docker build -t conflux-operator:e2e ./operator
          kind load docker-image conflux:e2e --name conflux-e2e
          kind load docker-image conflux-operator:e2e --name conflux-e2e

      - name: Install CRDs
        run: |
          cd operator
          make install

      - name: Deploy operator
        run: |
          cd operator
          make deploy IMG=conflux-operator:e2e

      - name: Wait for operator
        run: |
          kubectl wait --for=condition=available \
            deployment/raft-operator-controller-manager \
            -n raft-operator-system \
            --timeout=120s

      - name: Run E2E tests
        run: |
          go test -v -timeout=30m \
            -coverprofile=coverage-e2e.out \
            ./test/e2e/...

      - name: Upload E2E coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage-e2e.out
          flags: e2e
          fail_ci_if_error: false

      - name: Collect logs on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl logs -n raft-operator-system \
            -l control-plane=controller-manager --tail=100 || true
          kubectl describe pods -l app=raft -A || true
          kubectl get events --sort-by='.lastTimestamp' -A || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            test_output.log
            test_debug.log
          retention-days: 7
          if-no-files-found: ignore

  # Coverage report summary
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, operator-tests]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Coverage summary
        run: |
          echo "Coverage reports are uploaded separately by each job"
          echo "View combined coverage at: https://codecov.io/gh/${{ github.repository }}"
