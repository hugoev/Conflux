version: '3.8'

services:
  raft-node-1:
    build: .
    container_name: raft-node-1
    ports:
      - "8081:8080"  # HTTP API
      - "9091:9090"  # Raft RPC
    environment:
      - NODE_ID=raft-node-1:9090
      - RAFT_PORT=9090
      - API_PORT=8080
      - PEERS=raft-node-1:9090,raft-node-2:9090,raft-node-3:9090
    networks:
      - raft-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  raft-node-2:
    build: .
    container_name: raft-node-2
    ports:
      - "8082:8080"
      - "9092:9090"
    environment:
      - NODE_ID=raft-node-2:9090
      - RAFT_PORT=9090
      - API_PORT=8080
      - PEERS=raft-node-1:9090,raft-node-2:9090,raft-node-3:9090
    networks:
      - raft-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  raft-node-3:
    build: .
    container_name: raft-node-3
    ports:
      - "8083:8080"
      - "9093:9090"
    environment:
      - NODE_ID=raft-node-3:9090
      - RAFT_PORT=9090
      - API_PORT=8080
      - PEERS=raft-node-1:9090,raft-node-2:9090,raft-node-3:9090
    networks:
      - raft-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  raft-network:
    driver: bridge
